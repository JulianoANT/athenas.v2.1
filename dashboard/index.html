<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />

    <!-- Identidade oficial Athenas -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/athenas-logo.svg" />
    <link rel="mask-icon" href="/athenas-logo.svg" color="#48CAE4" />

    <!-- viewport-fit=cover: aproveita a tela inteira em celulares com notch,
         usado junto com as safe-area-inset do CSS. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B132B" />
    <meta name="color-scheme" content="dark light" />

    <!-- Em campo o painel roda em tela cheia no tablet/celular da equipe. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Athenas OS" />

    <meta
      name="description"
      content="Athenas - Central de Telemetria da Equipe Athenas (DUNA 2026)."
    />
    <title>Athenas - Central de Telemetria</title>

    <script>
      // Aplica o tema antes do React montar para evitar flash (default: noite).
      try {
        var t = localStorage.getItem("athenas:theme");
        if (t !== "sol") document.documentElement.classList.add("dark");
        document.documentElement.dataset.theme = t === "sol" ? "sol" : "noite";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
