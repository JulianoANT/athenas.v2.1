server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão gzip para os assets de texto servidos pela SPA.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        text/css
        image/svg+xml;

    # SPA fallback: qualquer rota desconhecida cai no index.html
    # para que o React Router resolva o roteamento no client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agressivo para assets estáticos com hash no nome (gerados pelo Vite).
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|ico|webp|avif|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html nunca deve ser cacheado para que novos deploys sejam carregados.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
