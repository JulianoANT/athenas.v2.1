; ============================================================================
;  Athenas v2.2 — Firmware do ESCRAVO (a bordo da embarcacao)
;  Placa: Heltec WiFi LoRa 32 (V3) — ESP32-S3 + SX1262 + OLED
; ============================================================================

[env:heltec_v3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; A Heltec V3 tem USB nativo no ESP32-S3, mas a placa expoe um CP2102 no
; conector. `monitor_rts/dtr = 0` evita que abrir o monitor serial resete a
; placa no meio de uma sessao de telemetria.
monitor_rts = 0
monitor_dtr = 0

; Bibliotecas:
;  - RadioLib: driver do SX1262. Escolhido por ser o mais completo e o unico
;    com API assincrona (startTransmit + IRQ) — essencial para nao bloquear o
;    loop por 82 ms a cada quadro.
;  - U8g2: OLED SSD1306 embutido na placa.
;  - OneWire + DallasTemperature: DS18B20 (temperatura do estator).
;  - TinyGPSPlus: parsing NMEA do Neo-6M.
;  - DHT sensor library: temperatura/umidade dentro do casco.
;
;  O MPU6050 NAO tem biblioteca aqui de proposito: o driver I2C esta embutido
;  no main.cpp (~40 linhas), o que elimina uma dependencia e da controle total
;  sobre o tratamento de falha do barramento.
lib_deps =
  jgromes/RadioLib @ ^7.1.2
  olikraus/U8g2 @ ^2.35.30
  paulstoffregen/OneWire @ ^2.3.7
  milesburton/DallasTemperature @ ^3.11.0
  mikalhart/TinyGPSPlus @ ^1.0.3
  adafruit/DHT sensor library @ ^1.4.6
  adafruit/Adafruit Unified Sensor @ ^1.1.14

build_flags =
  -Wall
  -DCORE_DEBUG_LEVEL=1
  ; Protocolo binario compartilhado com o firmware do mestre. Um unico header,
  ; para os dois lados nunca divergirem.
  -I../shared
  ; Console de debug pelo conversor USB-serial da placa (nao pelo USB nativo).
  -DARDUINO_USB_CDC_ON_BOOT=0
