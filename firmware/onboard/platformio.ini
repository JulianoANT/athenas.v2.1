; ============================================================================
;  Athenas v2.0 - Firmware de bordo (onboard)
;  Plataforma: ESP32 (DevKit) | Framework: Arduino | Build: PlatformIO
; ============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Velocidade do monitor serial (use o mesmo valor no Serial.begin()).
monitor_speed = 115200

; Dependencias da Diretriz Athenas v2.0.
; - ESPAsyncWebServer-esphome: servidor HTTP + WebSocket assincronos.
;   (puxa AsyncTCP automaticamente como dependencia transitiva)
; - ArduinoJson: serializacao do contrato JSON de telemetria.
; - OneWire + DallasTemperature: sensor de temperatura DS18B20.
; - TinyGPSPlus: parsing das sentencas NMEA do GPS Neo-6M.
lib_deps =
  ottowinter/ESPAsyncWebServer-esphome @ ^3.0.0
  bblanchon/ArduinoJson @ ^6.21.3
  paulstoffregen/OneWire @ ^2.3.7
  milesburton/DallasTemperature @ ^3.11.0
  mikalhart/TinyGPSPlus @ ^1.0.3

; O frontend e servido a partir do LittleFS (particao SPIFFS/LittleFS).
; Descomente a linha abaixo se for usar a particao LittleFS para o "data/".
; board_build.filesystem = littlefs
