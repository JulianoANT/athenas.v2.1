; ============================================================================
;  Athenas v2.2 — Firmware do MESTRE (estacao de terra)
;  Placa: Heltec WiFi LoRa 32 (V3) — ESP32-S3 + SX1262 + OLED
; ============================================================================

[env:heltec_v3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino

monitor_speed = 115200
upload_speed = 921600
monitor_rts = 0
monitor_dtr = 0

; Bibliotecas:
;  - RadioLib: driver do SX1262 (recepcao assincrona por interrupcao).
;  - U8g2: OLED com o painel de qualidade do enlace.
;  - ESPAsyncWebServer: WebSocket assincrono para o dashboard.
;    ATENCAO: use o fork "esphome"; o repositorio original nao compila no
;    ESP32-S3 com as versoes atuais do core Arduino.
lib_deps =
  jgromes/RadioLib @ ^7.1.2
  olikraus/U8g2 @ ^2.35.30
  ottowinter/ESPAsyncWebServer-esphome @ ^3.0.0

build_flags =
  -Wall
  -DCORE_DEBUG_LEVEL=1
  ; Protocolo binario compartilhado com o firmware do escravo.
  -I../shared
  -DARDUINO_USB_CDC_ON_BOOT=0
