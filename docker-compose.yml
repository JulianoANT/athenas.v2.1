# Infraestrutura Docker do sistema Athenas v2.1.
#
# Sobe UM servico:
#   - dashboard: frontend (Vite + React) servido pelo Nginx (porta 5173 -> 80).
#
# NAO HA MAIS MOCK-SERVER. O Athenas OS v2.1 nao possui modo de simulacao:
# todo dado exibido vem do ESP32 a bordo, via WebSocket. O painel conecta
# direto na placa (ws://athenas.local/ws por mDNS, ou o IP configurado na
# engrenagem ao lado do indicador de conexao).
#
# Para o navegador enxergar o ESP32, o container precisa alcancar a rede local
# onde a placa esta. Em Linux, `network_mode: host` resolve; em Docker Desktop
# (Mac/Windows) prefira rodar o dashboard fora do Docker durante os testes de
# campo, com `npm run dev`.

services:
  dashboard:
    build: ./dashboard
    ports:
      - "5173:80"
    restart: unless-stopped
    environment:
      # Endereco padrao do ESP32. Pode ser sobrescrito em tempo de execucao
      # pela tripulacao, direto na interface.
      - VITE_TELEMETRY_WS=ws://athenas.local/ws
